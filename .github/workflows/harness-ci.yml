name: Harness CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify contract
        run: python scripts/verify_context.py --root .
      - name: Cold-start tests
        run: python -m unittest discover -s tests -v
